# Inventaire SSH : serveur de production (VPS PulseHeberg, Ubuntu 24.04)
# Ansible se connecte en root avec la clé personnelle de l'administrateur
# (aucun mot de passe ni clé privée dans ce dépôt).
[production]
vps-tanguy ansible_host=45.155.170.40 ansible_user=root ansible_python_interpreter=/usr/bin/python3

# Serveur d'intégration continue (Jenkins + SonarQube), séparé de la production
[ci]
vps-ci ansible_host=185.216.25.110 ansible_user=root ansible_python_interpreter=/usr/bin/python3
